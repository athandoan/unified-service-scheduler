apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
# Demo credentials only — matches backend/docker-compose.yml. NOT production.
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}