{{- /*
One-shot migration Job. Deliberately NOT a Helm hook: hook Jobs run after all
non-hook resources, so apps would start before migrations are applied. Apps
here simply start alongside; Phase 2 smoke runs after the Job completes.

Jobs are immutable: `k8s-apply` deletes the previous migrate Job (matched by
the app.kubernetes.io/component=migrate label) before each upgrade.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  # Unique per imageTag. Jobs are immutable, and ArgoCD Replace is a PUT (not
  # delete+create), so same-name updates fail once the controller stamps its
  # labels. A new tag = a new Job object (pure CREATE); ArgoCD prune removes
  # the old one. Same tag re-synced = identical spec = no-op success.
  name: {{ .Release.Name }}-migrate-{{ .Values.imageTag | sha256sum | trunc 10 }}
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    scheduler.migrate/image-tag: {{ .Values.imageTag | quote }}
    # ArgoCD: migrate runs after postgres (0), before apps (2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  # No spec.selector: this apiserver rejects user-supplied Job selectors
  # ("not auto-generated") and auto-generates from the template labels.
  # Uniqueness comes from the name alone; prune removes retired Jobs.
  template:
    metadata:
      labels:
        {{- include "scheduler.labels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.imagePrefix }}/migrate:{{ .Values.imageTag }}
          # Entrypoint is /app; -root points at the migrations tree copied by
          # the Dockerfile for PKG=./shared/migrate.
          args:
            - -root
            - /migrations
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: POSTGRES_PASSWORD