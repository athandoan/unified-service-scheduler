apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-technician
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "technician") | nindent 4 }}
  annotations:
    # ArgoCD: apps roll after the migrate Job (1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: technician
  template:
    metadata:
      labels:
        {{- include "scheduler.labels" (dict "ctx" . "component" "technician") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: technician
          image: {{ .Values.imagePrefix }}/technician:{{ .Values.imageTag }}
          env:
            - name: TECHNICIAN_DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/technician?sslmode=disable
            - name: TECHNICIAN_ADDR
              value: :9091
          ports:
            - name: grpc
              containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  # Compose DNS name: technician:9091 from booking.
  name: technician
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "technician") | nindent 4 }}
  annotations:
    # ArgoCD: stays with the technician Deployment in wave 2.
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: technician
  ports:
    - name: grpc
      port: 9091
      targetPort: grpc