apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-catalog
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "catalog") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: catalog
  template:
    metadata:
      labels:
        {{- include "scheduler.labels" (dict "ctx" . "component" "catalog") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog
          image: {{ .Values.imagePrefix }}/catalog:{{ .Values.imageTag }}
          env:
            - name: CATALOG_DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/catalog?sslmode=disable
            - name: CATALOG_ADDR
              value: :8081
          ports:
            - name: http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  # Compose DNS name: http://catalog:8081 from booking/gateway.
  name: catalog
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "catalog") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: catalog
  ports:
    - name: http
      port: 8081
      targetPort: http