apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  annotations:
    # ArgoCD: apps roll after the migrate Job (1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "scheduler.labels" (dict "ctx" . "component" "gateway") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.imagePrefix }}/gateway:{{ .Values.imageTag }}
          env:
            - name: GATEWAY_CATALOG_URL
              value: http://catalog:8081
            - name: GATEWAY_BOOKING_URL
              value: http://booking:8082
            - name: GATEWAY_ADDR
              value: :8080
          ports:
            # Public entrypoint for Phase 2 smoke (kubectl port-forward).
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  # Compose DNS name; Phase 2 smoke uses kubectl port-forward (no NodePort/Ingress).
  name: gateway
  labels:
    {{- include "scheduler.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  annotations:
    # ArgoCD: stays with the gateway Deployment in wave 2.
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http